{% set name = "ghc" %}
{% set version = "9.2.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://downloads.haskell.org/~ghc/{{ version }}/{{ name }}-{{ version }}-src.tar.xz
  sha256: 5f13d1786bf4fd12f4b45faa37abedb5bb3f36d5e58f7da5307e8bfe88a567a1
  patches:
    # alex and happy outputs are already in the source tarball
    - patches/make-alex-happy-optional.patch
    - patches/update-hadrian-cabal-project.patch
    - patches/fix-no-pie-detection-configure.patch  # [linux]
    - patches/remove-dangerous-macos-linker-flags.patch  # [osx]

build:
  number: 0
  skip: true  # [not unix or (osx and arm64) or ppc64le or aarch64]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - binutils >={{ binutils_version }}
    - cabal ==3.10.3.0
    - ghc-bootstrap ==9.2.8
    - llvm-tools {{ c_compiler_version }}.*
    - perl 5.32.*
    - pkg-config
    - python 3.10.*
    - autoconf
    - automake
    - file
    - m4
    - make
    - sed
  host:
    - gmp
    - libiconv
    - libffi
    - ncurses

test:
  files:
    - hello.hs
  requires:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - libiconv
    - ld_impl_{{ target_platform }} {{ binutils_version }}  # [linux]
    - lld {{ c_compiler_version }}.*  # [osx]
  commands:
    - ghc --help
    - ghc hello.hs -o hello

about:
  home: https://haskell.org/ghc/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Glorious Glasgow Haskell Compilation System

  doc_url: https://downloads.haskell.org/~ghc/latest/docs/html/users_guide/
  dev_url: https://github.com/ghc/ghc

extra:
  recipe-maintainers:
    - eggzilla
    - step21
    - xhochy
    - MementoRC
